name: frontend-react

networks:
  app-network:
    name: ${NETWORK_NAME}
    driver: bridge

services:
  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: ${NODE_CONTAINER_NAME}
    working_dir: ${NODE_WORKING_DIR}
    restart: always
    environment:
      APP_ENV: ${APP_ENV}
      VITE_AUTH_SERVICE_URL: ${VITE_AUTH_SERVICE_URL:-http://localhost:8000/api/v1}
      VITE_ORDER_SERVICE_URL: ${VITE_ORDER_SERVICE_URL:-http://localhost:8001/api}
      VITE_PRODUCT_SERVICE_URL: ${VITE_PRODUCT_SERVICE_URL:-http://localhost:5001/api/v1}
      VITE_ECOMMERCE_READ_SERVICE_URL: ${VITE_ECOMMERCE_READ_SERVICE_URL:-http://localhost:5004}
      VITE_ECOMMERCE_READ_GRAPHQL_URL: ${VITE_ECOMMERCE_READ_GRAPHQL_URL:-http://localhost:5004/graphql}
      VITE_SHIPPING_SERVICE_URL: ${VITE_SHIPPING_SERVICE_URL:-http://localhost:5005/api/v1}
      VITE_STRIPE_PUBLIC_KEY: ${VITE_STRIPE_PUBLIC_KEY:-}
      VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
      VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-osm}
      VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
      VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
    volumes:
      - ./src/app:${NODE_WORKING_DIR}/app:cached
      - ./src/components:${NODE_WORKING_DIR}/components:cached
      - ./src/features:${NODE_WORKING_DIR}/features:cached
      - ./src/routes:${NODE_WORKING_DIR}/routes:cached
      - ./src/styles:${NODE_WORKING_DIR}/styles:cached
      - ./src/utils:${NODE_WORKING_DIR}/utils:cached
      - ./src/lib:${NODE_WORKING_DIR}/lib
      - ./src/types:${NODE_WORKING_DIR}/types
      - ./src/assets:${NODE_WORKING_DIR}/assets
      - ./src/public:${NODE_WORKING_DIR}/public
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  nginx:
    image: nginx:stable-alpine
    container_name: ${NGINX_CONTAINER_NAME}
    ports:
      - "${APP_PORT:-3000}:80"
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d
      - ./src:${NGINX_WORKING_DIR}
    depends_on:
      node:
        condition: service_started
    networks:
      - app-network
