<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shop-icon-square.svg?v=5" />
    <link rel="shortcut icon" href="/shop-icon-square.svg?v=5" />
    <link rel="apple-touch-icon" href="/shop-icon-square.svg?v=5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Must apply before the app bundle's CSS loads, otherwise the reCAPTCHA
         badge (fixed, offset past the right edge) widens the page on mobile. -->
    <style>
      /* Early mobile overflow guard (before app CSS). iPhone Safari rubber-bands
         sideways if any paint is even a few px wider than the viewport. */
      html,
      body {
        margin: 0;
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
        overflow-x: clip;
        overscroll-behavior-x: none;
      }
      #root {
        max-width: 100%;
        min-width: 0;
        overflow-x: clip;
      }
      img,
      svg,
      video,
      canvas {
        max-width: 100%;
      }
      .grecaptcha-badge {
        display: none !important;
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load (unit.com.au-style: don't stall first paint on fonts). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      />
    </noscript>

    <title>Daily Need Items</title>

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-W4XPSNY7B1"
    ></script>

    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        window.dataLayer.push(arguments);
      }

      window.gtag = gtag;

      gtag("js", new Date());

      gtag("config", "G-W4XPSNY7B1", {
        send_page_view: false,
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
