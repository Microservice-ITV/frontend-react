name: 🚀 Frontend React Production Deploy

on:
  push:
    branches:
      - main

#####################################################
# 1. BUILD + PUSH DOCKER IMAGE
#####################################################

jobs:
  build-and-push:
    name: 🐳 Build & Push Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🧪 Create .env file
        run: |
          echo "${{ secrets.FRONTEND_ENV }}" > .env

      - name: 🐳 Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 🏗️ Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/node/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/frontend-react:latest
            ${{ secrets.DOCKER_USERNAME }}/frontend-react:${{ github.sha }}
          build-args: |
            VITE_AUTH_SERVICE_URL=https://api.dailyneeditems.com/auth
            VITE_PRODUCT_SERVICE_URL=https://api.dailyneeditems.com/products
            VITE_ECOMMERCE_READ_GRAPHQL_URL=https://api.dailyneeditems.com/graphql
            VITE_ORDER_SERVICE_URL=https://api.dailyneeditems.com/orders
            VITE_ECOMMERCE_READ_SERVICE_URL=https://api.dailyneeditems.com
            VITE_SHIPPING_SERVICE_URL=https://api.dailyneeditems.com/shipping
            VITE_BFF_SERVICE_URL=https://api.dailyneeditems.com/bff
            VITE_ASSET_BASE_URL=https://dnistore.sgp1.cdn.digitaloceanspaces.com
            VITE_MAP_PROVIDER=osm
            VITE_USE_MOCK_API=false
            VITE_RECAPTCHA_SITE_KEY=6LcO46otAAAAAGmfgkNYvcVfI-sZ8iA52SmcaUC9

  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: 🚀 SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          script: |
            set -Eeuo pipefail

            trap 'echo "❌ Deployment failed at line $LINENO: $BASH_COMMAND"' ERR

            echo "🚀 Deploying Frontend React..."

            DEPLOY_DIR="/var/www/html/microservices/frontend-react"
            COMPOSE_URL="https://raw.githubusercontent.com/Microservice-ITV/frontend-react/main/docker-compose.prod.yml"

            echo "📁 Preparing deployment directory..."

            rm -rf "$DEPLOY_DIR"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            echo "📍 Current directory:"
            pwd

            echo "📄 Downloading docker-compose.prod.yml..."
            echo "🔗 URL: $COMPOSE_URL"

            echo "🌐 Testing GitHub response..."

            curl -IL \
              --connect-timeout 10 \
              --max-time 30 \
              "$COMPOSE_URL"

            echo "📥 Downloading compose file..."

            curl -fL \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 3 \
              --retry-delay 2 \
              "$COMPOSE_URL" \
              -o docker-compose.prod.yml

            echo "✅ Compose file downloaded."

            echo "📄 File information:"
            ls -lah docker-compose.prod.yml

            echo "📄 First 30 lines:"
            sed -n '1,30p' docker-compose.prod.yml

            echo "📄 Creating .env..."

            cat > .env <<EOF
            ${{ secrets.FRONTEND_ENV }}
            EOF

            chmod 600 .env

            echo "✅ .env created."

            echo "🔐 Logging into Docker Hub..."

            echo "${{ secrets.DOCKER_TOKEN }}" \
              | docker login \
              -u "${{ secrets.DOCKER_USERNAME }}" \
              --password-stdin

            echo "✅ Docker Hub login successful."

            echo "🐳 Docker Compose version:"
            docker compose version

            echo "🔍 Validating Docker Compose configuration..."

            docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              config

            echo "✅ Docker Compose configuration is valid."

            echo "🐳 Pulling Frontend Docker image..."

            docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              pull

            echo "✅ Frontend image pulled."

            echo "🚀 Starting Frontend container..."

            docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              up -d \
              --remove-orphans

            echo "✅ Frontend container started."

            echo "⏳ Waiting for Frontend service..."

            sleep 10

            echo "📊 Container status:"

            docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              ps

            echo "📋 Frontend container logs:"

            docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              logs --tail=100

            echo "🧹 Cleaning unused Docker images..."

            docker image prune -f

            echo "✅ Frontend React Deployment Successful!"