name: 🚀 Frontend React Production Deploy

on:
  push:
    branches:
      - main

#####################################################
# 1. BUILD & PUSH TO DOCKER HUB
#####################################################

jobs:

  build-and-push:
    name: 🐳 Build & Push Frontend Image
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      #################################################
      # Create .env for build
      #################################################

      - name: 🧪 Create .env file
        run: |
          echo "${{ secrets.FRONTEND_ENV }}" > .env

      #################################################
      # Docker Hub Login
      #################################################

      - name: 🐳 Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      #################################################
      # Build & Push Frontend Image
      #################################################

      - name: 🏗️ Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/node/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/frontend-react:latest
            ${{ secrets.DOCKER_USERNAME }}/frontend-react:${{ github.sha }}
          build-args: |
            VITE_AUTH_SERVICE_URL=https://api.dailyneeditems.com/auth
            VITE_PRODUCT_SERVICE_URL=https://api.dailyneeditems.com/products
            VITE_ECOMMERCE_READ_GRAPHQL_URL=https://api.dailyneeditems.com/graphql
            VITE_ORDER_SERVICE_URL=https://api.dailyneeditems.com/orders
            VITE_ECOMMERCE_READ_SERVICE_URL=https://api.dailyneeditems.com
            VITE_SHIPPING_SERVICE_URL=https://api.dailyneeditems.com/api/v1
            VITE_PROMOTION_SERVICE_URL=https://api.dailyneeditems.com/promotions
            VITE_TAX_SERVICE_URL=https://api.dailyneeditems.com/tax
            VITE_BFF_SERVICE_URL=https://api.dailyneeditems.com/bff
            VITE_ACCOUNTING_SERVICE_URL=https://api.dailyneeditems.com/accounting
            VITE_NOTIFICATION_SERVICE_URL=https://api.dailyneeditems.com
            VITE_NOTIFICATION_SOCKET_PATH=/notifications/socket.io/
            VITE_ASSET_BASE_URL=https://dnistore.sgp1.cdn.digitaloceanspaces.com
            VITE_MAP_PROVIDER=osm
            VITE_USE_MOCK_API=false
            VITE_RECAPTCHA_SITE_KEY=6LcO46otAAAAAGmfgkNYvcVfI-sZ8iA52SmcaUC9

  #####################################################
  # 2. DEPLOY TO VPS
  #####################################################

  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:

      #################################################
      # Checkout repository
      #################################################

      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      #################################################
      # Upload production compose file to VPS
      #################################################

      - name: 📤 Upload docker-compose.prod.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.prod.yml"
          target: "/var/www/html/microservices/frontend-react/"

      #################################################
      # SSH Deploy
      #################################################

      - name: 🚀 SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          script: |
            set -Eeuo pipefail

            trap 'echo "❌ Deployment failed at line $LINENO: $BASH_COMMAND"' ERR

            echo "🚀 Deploying Frontend React..."

            DEPLOY_DIR="/var/www/html/microservices/frontend-react"

            ##################################################
            # 1. Prepare deployment directory
            ##################################################

            echo "📁 Preparing deployment directory..."

            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            echo "📍 Current directory:"
            pwd

            ##################################################
            # 2. Verify production compose file
            ##################################################

            echo "📄 Checking docker-compose.prod.yml..."

            test -f docker-compose.prod.yml

            echo "✅ docker-compose.prod.yml found"

            echo "📄 Compose file:"
            ls -lah docker-compose.prod.yml

            ##################################################
            # 3. Create production environment
            ##################################################

            echo "📄 Creating .env..."

            cat > .env <<EOF
            ${{ secrets.FRONTEND_ENV }}
            EOF

            chmod 600 .env

            echo "✅ .env created"

            ##################################################
            # 4. Docker Hub Login
            ##################################################

            echo "🔐 Logging into Docker Hub..."

            echo "${{ secrets.DOCKER_TOKEN }}" \
              | docker login \
              -u "${{ secrets.DOCKER_USERNAME }}" \
              --password-stdin

            echo "✅ Docker Hub login successful"

            ##################################################
            # 5. Validate Docker Compose
            ##################################################

            echo "🐳 Docker Compose version..."

            docker compose version

            echo "🔍 Validating Docker Compose configuration..."

            docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              config

            echo "✅ Docker Compose configuration is valid"

            ##################################################
            # 6. Pull Frontend Docker image
            ##################################################

            echo "🐳 Pulling Frontend Docker image..."

            docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              pull

            echo "✅ Frontend image pulled"

            ##################################################
            # 7. Start / Update container
            ##################################################

            echo "🚀 Starting Frontend container..."

            docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              up -d \
              --remove-orphans

            echo "✅ Frontend container started"

            ##################################################
            # 8. Wait for service
            ##################################################

            echo "⏳ Waiting for Frontend service..."

            sleep 10

            ##################################################
            # 9. Container status
            ##################################################

            echo "📊 Container status..."

            docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              ps

            ##################################################
            # 10. Container logs
            ##################################################

            echo "📋 Frontend container logs..."

            docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              logs --tail=100

            ##################################################
            # 11. Cleanup unused images
            ##################################################

            echo "🧹 Cleaning unused Docker images..."

            docker image prune -f

            echo "✅ Frontend React Deployment Successful!"