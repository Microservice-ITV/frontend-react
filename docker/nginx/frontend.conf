server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/html/frontend;

    location = /health {
        access_log off;
        return 204;
    }

    # Hide DigitalOcean host in the browser Network tab:
    # /dnistore/categories/... → sgp1.digitaloceanspaces.com/dnistore/categories/...
    location /dnistore/ {
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host sgp1.digitaloceanspaces.com;
        proxy_set_header Connection "";
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_pass https://sgp1.digitaloceanspaces.com/dnistore/;
        proxy_intercept_errors off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Vite hashed bundles (/assets/index-….js, etc.).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
    }

    # HTML must stay fresh so clients pick up new hashed asset names after deploy.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
