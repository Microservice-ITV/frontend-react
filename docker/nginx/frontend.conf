server {

    listen 80;

    server_name dailyneeditems.com www.dailyneeditems.com;

    root /var/www/html/frontend;
    index index.html;

    ####################################################
    # React Router Support
    ####################################################
    location / {
        try_files $uri $uri/ /index.html;
    }

    ####################################################
    # Health Check
    ####################################################
    location = /health {
        access_log off;
        return 204;
    }

    ####################################################
    # Static Asset Cache
    ####################################################
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        access_log off;
    }
}