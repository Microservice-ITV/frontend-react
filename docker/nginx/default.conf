server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml+rss image/svg+xml;

    location = /health {
        access_log off;
        return 204;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache immutable assets (Vite default pattern)
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # PRODUCTION: optional same-origin proxy if you cannot use CORS on third-party APIs (uncomment and set upstream):
    # location /nominatim/ {
    #     proxy_pass https://nominatim.openstreetmap.org/;
    #     proxy_set_header Host nominatim.openstreetmap.org;
    # }
}